    <script>
      // Satisfy Vite HMR client in container environment where HMR WebSocket is not open
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          function PatchedWebSocket(url, protocols) {
            var isViteHmr = protocols === 'vite-hmr' ||
              (typeof protocols === 'string' && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && url.indexOf('token=') !== -1 && url.indexOf('ws') === 0);
            if (isViteHmr) {
              var listeners = {};
              var mock = {
                readyState: 1, // OPEN
                OPEN: 1,
                CLOSED: 3,
                CLOSING: 2,
                CONNECTING: 0,
                send: function() {},
                close: function() {},
                addEventListener: function(event, cb) {
                  listeners[event] = listeners[event] || [];
                  listeners[event].push(cb);
                  if (event === 'open') {
                    setTimeout(function() {
                      try { cb({ type: 'open' }); } catch(e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(event, cb) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(function(fn) { return fn !== cb; });
                  }
                },
                dispatchEvent: function() { return true; }
              };
              return mock;
            }
            return new OrigWebSocket(url, protocols);
          }
          PatchedWebSocket.prototype = OrigWebSocket.prototype;
          PatchedWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = OrigWebSocket.OPEN;
          PatchedWebSocket.CLOSING = OrigWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = OrigWebSocket.CLOSED;
          window.WebSocket = PatchedWebSocket;
        }

        window.addEventListener('error', function(event) {
          if (event && (
            (event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('@vite/client') !== -1)) ||
            (event.filename && event.filename.indexOf('@vite/client') !== -1)
          )) {
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            event.preventDefault && event.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && String(event.reason).indexOf('WebSocket') !== -1) {
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            event.preventDefault && event.preventDefault();
          }
        }, true);
      })();
    </script>
