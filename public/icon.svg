<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8bb5b0" />
      <stop offset="100%" stop-color="#5a8b84" />
    </linearGradient>
    <linearGradient id="slat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f0f7f5" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a34" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Inner Frame Shadowed Container -->
  <g filter="url(#shadow)">
    <!-- Top Headrail -->
    <rect x="96" y="112" width="320" height="36" rx="10" fill="#ffffff" />
    
    <!-- Window Slats (Pleated / Blinds) -->
    <rect x="112" y="166" width="288" height="22" rx="6" fill="url(#slat)" />
    <rect x="112" y="204" width="288" height="22" rx="6" fill="url(#slat)" />
    <rect x="112" y="242" width="288" height="22" rx="6" fill="url(#slat)" />
    <rect x="112" y="280" width="288" height="22" rx="6" fill="url(#slat)" />
    <rect x="112" y="318" width="288" height="22" rx="6" fill="url(#slat)" />
    
    <!-- Bottom Rail -->
    <rect x="96" y="356" width="320" height="30" rx="8" fill="#ffffff" />

    <!-- Center Adjustment Ring / Pull Cord -->
    <circle cx="256" cy="406" r="14" fill="#ffffff" />
    <circle cx="256" cy="406" r="8" fill="#5a8b84" />
  </g>

  <!-- CFD Text Label at Bottom -->
  <text x="256" y="468" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4">CFD</text>
</svg>
